<style>

    body {

        border-radius: 8px;
        display: flex;
        flex-direction: column;
    }

    /* Header with 3 dots on each side and Center Scrolling text */
    .terminal-header {
        background: rgba(0, 255, 0, 0.15);
        padding: 6px 10px;
        border-bottom: 1px solid #00ff00;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 35px;
    }

    .window-dots {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ff00;
    }

    /* Marquee Center Container */
    .marquee-container {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        display: flex;
        align-items: center;
    }

    .scrolling-header-text {
        display: inline-block;
        color: #00ff00;
        font-size: 0.82rem;
        font-weight: bold;
        letter-spacing: 1px;
        animation: marquee-scroll 8s linear infinite;
        padding-left: 100%;
    }

    @keyframes marquee-scroll {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-100%); }
    }

    /* Terminal Body */
    .terminal-body {
        flex: 1;
        padding: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    #console-output {
        display: flex;
        flex-direction: column;
        gap: 3px;
    }

    .log-line {
        font-size: 0.82rem;
        line-height: 1.3;
        white-space: nowrap;
        word-break: break-all;
    }

    .warn { color: #ffff00; }
    .danger { color: #ff0000; font-weight: bold; }

    /* Active Typing Line Cursor */
    .active-line {
        color: #00ff00;
        font-size: 0.82rem;
        white-space: nowrap;
    }

    .cursor {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: #00ff00;
        vertical-align: middle;
        margin-left: 2px;
    }

    /* Final Screen */
    #final-screen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000000;
        z-index: 99999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;

        font-weight: 900;
        text-transform: uppercase;

        font-size: 2.8rem;
        color: #ff0000;
    }

    .blink {
        animation: solid-blink 0.4s infinite steps(1, start);
    }

    @keyframes solid-blink {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0;
        }
    }
</style>
